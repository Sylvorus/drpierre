<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 220px; font-family: sans-serif; padding: 12px; margin: 0; background: #fdfdfd; }
    label { font-size: 13px; font-weight: bold; color: #333; display: block; margin-top: 8px; }
    input, select { width: 100%; padding: 8px; margin-top: 4px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    #status { font-size: 11px; color: #28a745; margin-top: 6px; height: 14px; font-weight: bold; }
  </style>
</head>
<body>
  <label for="api-key">Gemini API Key:</label>
  <input type="password" id="api-key" placeholder="Paste key here...">

  <label for="model-select">Gemini Model:</label>
  <select id="model-select">
    <option value="gemini-3.5-flash-lite">3.5 Flash Lite</option>
    <option value="gemini-3.5-flash">3.5 Flash</option>
    <option value="gemini-3.6-flash">3.6 Flash</option>
    <option value="gemini-3.7-flash">3.7 Flash</option>
    <option value="gemini-3.8-flash">3.8 Flash</option>
  </select>

  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
